    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        $(function () {
            gsap.registerPlugin(ScrollTrigger);

            const $cardWrap = $('.sec04 .card-wrap');
            const $slides = $('.sec04 .circle');

            if (!$cardWrap.length || !$slides.length) {
                return;
            }

            const sectionDeg = 25; // 카드 사이 각도
            const radius = 1200;   // 원의 반지름
            const sections = $slides.length;
            const totalRotation = (sections - 1) * sectionDeg;

            /*
             * 카드들을 원 둘레에 배치
             *
             * 반드시 transform을 한 번에 적용해야
             * 회전 후 원 바깥쪽으로 이동합니다.
             */
            $slides.each(function (index) {
                const angle = index * sectionDeg;

                this.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-${radius}px)`;
            });

            function updateActiveSlide(progress) {
                const adjustedProgress = gsap.utils.clamp(
                    0, 1, (progress - 0.1) / 0.9
                );

                const activeIndex = Math.round(
                    adjustedProgress * (sections - 1)
                );

                $slides.removeClass('active');
                $slides.eq(activeIndex).addClass('active');
            }

            ScrollTrigger.create({
                trigger: '.sec04',
                start: 'top top',
                end: '+=300%',
                pin: true,
                scrub: true,
                anticipatePin: 1,

                onUpdate(self) {
                    const progress = self.progress;

                    const adjustedProgress =
                        progress <= 0.1
                            ? 0
                            : gsap.utils.clamp(
                                0,
                                1,
                                (progress - 0.1) / 0.9
                            );

                    gsap.set($cardWrap, {
                        rotation: -totalRotation * adjustedProgress,
                        transformOrigin: '50% 50%'
                    });

                    updateActiveSlide(progress);
                }
            });

            $slides.eq(0).addClass('active');
        });
    </script>
